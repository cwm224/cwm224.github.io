    <script>
        function reg(){
            let u = user.value;
            let p = pass.value;
            if(!u||!p) return alert("不能为空");
            localStorage.setItem("name",u);
            localStorage.setItem("pass",p);
            alert("注册成功");
        }

                function login(){
                    let u = user.value;
                    let p = pass.value;
                    let saveUser = localStorage.getItem("name");
                    let savePwd = localStorage.getItem("pass");
                    if(u===saveUser && p===savePwd){
                        alert("登录成功");
                    }else{
                        alert("账号或密码错误");
                    }
